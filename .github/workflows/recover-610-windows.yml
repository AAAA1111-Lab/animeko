name: Recover 6.1.0 windows asset (temp)

# 一次性任务: 把运行 34481097772 的 ani-windows-x64-portable artifact
# 打包为 Animeko-6.1.0-windows-x64.zip 并上传到 6.1.0 Release.
# 资产已存在时自动跳过; 恢复完成后本文件会被删除.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-610-windows.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recover asset to 6.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 6.1.0 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx 'Animeko-6.1.0-windows-x64.zip'; then
            echo "资产已存在, 无需恢复."
            exit 0
          fi
          gh run download 34481097772 -n ani-windows-x64-portable --repo "$GITHUB_REPOSITORY"
          zip -r Animeko-6.1.0-windows-x64.zip .
          gh release upload 6.1.0 Animeko-6.1.0-windows-x64.zip --clobber --repo "$GITHUB_REPOSITORY"
          echo "恢复完成, 当前 6.1.0 资产:"
          gh release view 6.1.0 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
