name: Manual Build (Windows & Android)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '选择构建平台 (Target Platform)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'android'
          - 'windows'
      create_release:
        description: '发布到 GitHub Releases (可在 Releases 页面直接点击下载 .apk 与单层 .zip)'
        required: true
        default: true
        type: boolean
      release_tag:
        description: 'Release Tag 名称 (留空则默认为 v6.1.0-build-<运行编号>)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: 'Build Android APK'
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable Linux Swap
        continue-on-error: true
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Configure local.properties
        run: |
          echo "ani.android.abis=arm64-v8a" >> local.properties
          echo "ani.android.splits=false" >> local.properties
          echo "ani.android.universal=false" >> local.properties
          echo "ani.enable.firebase=false" >> local.properties
          echo "jvm.toolchain.version=21" >> local.properties
          echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties
          echo "signing_release_storeFileFromRoot=signing/animeko-release.keystore" >> local.properties
          echo "signing_release_storePassword=animeko123" >> local.properties
          echo "signing_release_keyAlias=animeko" >> local.properties
          echo "signing_release_keyPassword=animeko123" >> local.properties

      - name: Cache JBR 21
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/jbrsdk_jcef-21*
          key: jbr-21-${{ runner.os }}-${{ hashFiles('.github/workflows/download_jbr.py') }}

      - name: Download JBR 21
        id: download-jbr
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
          JBR_URL: 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz'
          JBR_CHECKSUM_URL: 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz.checksum'
        run: python3 .github/workflows/download_jbr.py

      - name: Setup JBR 21
        uses: gmitch215/setup-java@6d2c5e1f82f180ae79f799f0ed6e3e5efb4e664d
        with:
          java-version: '21'
          distribution: 'jdkfile'
          jdkFile: ${{ steps.download-jbr.outputs.jbrLocation }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: |
          ./gradlew assembleDefaultRelease \
            --parallel \
            --build-cache \
            "-Dfile.encoding=UTF-8" \
            "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx4g"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ani-android-release-apk
          path: app/android/build/outputs/apk/default/release/*.apk
          if-no-files-found: error

  build-windows:
    name: 'Build Windows Distributable'
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure local.properties
        shell: bash
        run: |
          echo "ani.enable.firebase=false" >> local.properties
          echo "jvm.toolchain.version=21" >> local.properties

      - name: Cache JBR 21
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/jbrsdk_jcef-21*
          key: jbr-21-${{ runner.os }}-${{ hashFiles('.github/workflows/download_jbr.py') }}

      - name: Download JBR 21
        id: download-jbr
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
          JBR_URL: 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-windows-x64-b1163.116.tar.gz'
          JBR_CHECKSUM_URL: 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-windows-x64-b1163.116.tar.gz.checksum'
        shell: cmd
        run: python .github/workflows/download_jbr.py

      - name: Setup JBR 21
        uses: gmitch215/setup-java@6d2c5e1f82f180ae79f799f0ed6e3e5efb4e664d
        with:
          java-version: '21'
          distribution: 'jdkfile'
          jdkFile: ${{ steps.download-jbr.outputs.jbrLocation }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Build Windows Release Distributable
        shell: bash
        run: |
          ./gradlew :app:desktop:createReleaseDistributable \
            --parallel \
            --build-cache \
            "-Dfile.encoding=UTF-8" \
            "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx4g"

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: ani-windows-x64-portable
          path: app/desktop/build/compose/binaries/main-release/app
          if-no-files-found: error

  publish-release:
    name: 'Publish to GitHub Release'
    needs: [build-android, build-windows]
    if: ${{ always() && inputs.create_release && (needs.build-android.result == 'success' || needs.build-windows.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-artifacts

      - name: Package Assets for Release
        run: |
          mkdir -p release-files
          # 处理 Android APK (规范命名为 Animeko-6.1.0-arm64-v8a.apk，直接安装，无需解压)
          if [ -d "raw-artifacts/ani-android-release-apk" ]; then
            for f in raw-artifacts/ani-android-release-apk/*.apk; do
              if [ -f "$f" ]; then
                cp "$f" "release-files/Animeko-6.1.0-arm64-v8a-release.apk"
              fi
            done
          fi
          # 压缩 Windows 绿色便携包 (单层 zip，解压即用)
          if [ -d "raw-artifacts/ani-windows-x64-portable" ]; then
            cd raw-artifacts/ani-windows-x64-portable
            zip -r ../../release-files/Animeko-6.1.0-windows-x64.zip .
            cd ../..
          fi
          ls -lh release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "${{ inputs.release_tag != '' && inputs.release_tag || format('v6.1.0-build-{0}', github.run_number) }}"
          name: "${{ inputs.release_tag != '' && inputs.release_tag || format('Animeko v6.1.0 (Build No.{0})', github.run_number) }}"
          body: |
            ### Animeko v6.1.0 构建产物 (Build #${{ github.run_number }})
            
            - **Android**: `Animeko-6.1.0-arm64-v8a-release.apk` (Release 正式版，包名 `me.him188.ani`，手机可直接点击下载安装，无需解压)
            - **Windows**: `Animeko-6.1.0-windows-x64.zip` (绿色便携版，单层压缩包解压即用)
            
            *构建方式: GitHub Actions 手动调度*
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

